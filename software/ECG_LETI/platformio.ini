[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

lib_deps =
    olikraus/U8g2 @ ^2.35.30      ; Отличная библиотека для OLED 0.96"
    greiman/SdFat @ ^2.2.3        ; Более стабильная библиотека для MicroSD, чем стандартная SD
    tzapu/WiFiManager @ ^2.0.16-rc.2 ; Для Captive Portal (настройка Wi-Fi страницы)
    olikraus/U8g2 @ ^2.35.30
    mathertel/OneButton @ ^2.5.0 ;